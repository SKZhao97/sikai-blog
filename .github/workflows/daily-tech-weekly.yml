name: Daily Tech Weekly

on:
  schedule:
    - cron: '30 0 * * *'
    - cron: '45 0 * * *'
  workflow_dispatch:
    inputs:
      run_at:
        description: 'Optional ISO datetime, e.g. 2026-03-29T08:30:00+08:00'
        required: false
        type: string
      dry_run:
        description: 'Run without writing files'
        required: false
        default: false
        type: boolean
      min_events:
        description: 'Optional override for minimum events required to publish'
        required: false
        type: string
      force_rewrite_date:
        description: 'Rewrite the existing section for the target date'
        required: false
        default: false
        type: boolean
      force_regenerate_cover:
        description: 'Regenerate cover.svg even if it already exists'
        required: false
        default: true
        type: boolean

permissions:
  contents: write

concurrency:
  group: daily-tech-weekly
  cancel-in-progress: false

jobs:
  update-weekly:
    runs-on: ubuntu-latest
    env:
      TZ: Asia/Shanghai
      PYTHONUNBUFFERED: "1"
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: pip install -r scripts/tech_weekly/requirements.txt

      - name: Run updater
        run: |
          CMD="python -m scripts.tech_weekly.run"
          if [ -n "${{ inputs.run_at }}" ]; then
            CMD="$CMD --run-at '${{ inputs.run_at }}'"
          fi
          if [ "${{ inputs.dry_run }}" = "true" ]; then
            CMD="$CMD --dry-run"
          fi
          if [ -n "${{ inputs.min_events }}" ]; then
            CMD="$CMD --min-events ${{ inputs.min_events }}"
          fi
          if [ "${{ inputs.force_rewrite_date }}" = "true" ]; then
            CMD="$CMD --force-rewrite-date"
          fi
          if [ "${{ inputs.force_regenerate_cover }}" = "true" ]; then
            CMD="$CMD --force-regenerate-cover"
          fi
          echo "$CMD"
          eval "$CMD"

      - name: Commit changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add content/post
          if git diff --cached --quiet; then
            echo "No changes to commit"
            exit 0
          fi
          git commit -m "Add/update tech weekly"
          git push
